<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Download</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 12px;
  }
  p {
    color: #aaa;
    line-height: 1.5;
  }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1rem;
    background: #635bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background: #4f47e6;
  }
  button:disabled {
    background: #444;
    cursor: not-allowed;
  }
  .error {
    color: #ff6b6b;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="content">
      <h1>Preparing your download…</h1>
      <p>Hang tight, this only takes a second.</p>
    </div>
  </div>

  <script>
    // TODO: replace with your actual deployed edge function URL.
    // Format is: https://YOUR_PROJECT_REF.supabase.co/functions/v1/get-download-url
    const EDGE_FUNCTION_URL = 'https://fpjsabdqbxlymqtoemlt.supabase.co/functions/v1/get-download-url';

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    const listingFileId = params.get('file');
    const buyerEmail = params.get('email');
    const content = document.getElementById('content');

    async function loadDownload() {
      if (!orderId || !listingFileId || !buyerEmail) {
        content.innerHTML = `
          <h1 class="error">Missing download link</h1>
          <p>This page needs a valid link from your confirmation email.</p>
        `;
        return;
      }

      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, listingFileId, buyerEmail }),
        });
        const data = await res.json();

        if (!res.ok) {
          content.innerHTML = `
            <h1 class="error">Can't load this download</h1>
            <p>${data.error || 'Something went wrong. Please contact support if this keeps happening.'}</p>
          `;
          return;
        }

        content.innerHTML = `
          <h1>Your file is ready</h1>
          <p>Click below to download${data.fileName ? `: <strong>${data.fileName}</strong>` : ''}.
          This link expires in 10 minutes, so grab it now.</p>
          <button id="downloadBtn">Download</button>
        `;

        document.getElementById('downloadBtn').addEventListener('click', () => {
          window.location.href = data.url;
        });
      } catch (err) {
        content.innerHTML = `
          <h1 class="error">Something went wrong</h1>
          <p>Please try again in a moment, or contact support if it persists.</p>
        `;
        console.error(err);
      }
    }

    loadDownload();
  </script>
</body>
</html>
